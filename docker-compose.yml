version: '3.9'
services:
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_DATABASE: wppcentral
      MYSQL_USER: wpp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - wpp_central_mysqldata_nao_apagar:/var/lib/mysql

  backend:
    build: ./backend
    restart: always
    depends_on: [mysql]
    ports:
      - "3002:3001"
    environment:
      DATABASE_URL: mysql://wpp:${MYSQL_PASSWORD}@mysql:3306/wppcentral
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      TZ: America/Sao_Paulo
      PRISMA_QUERY_ENGINE_LIBRARY: /app/node_modules/.prisma/client/libquery_engine-linux-musl-openssl-3.0.x.so.node
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID}
      GOOGLE_SERVICE_ACCOUNT_KEY_FILE: /app/credentials/google-service-account.json
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AVALIACAO_PROVIDER: ${AVALIACAO_PROVIDER}
      RAG_API_URL: ${RAG_API_URL}
      RAG_API_KEY: ${RAG_API_KEY}
      CLICKUP_API_TOKEN: ${CLICKUP_API_TOKEN}
      CLICKUP_LIST_ID: ${CLICKUP_LIST_ID}
    volumes:
      - ./auth_session:/app/auth_session
      - ./backend/uploads:/app/uploads
      - ./backend/credentials:/app/credentials:ro

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "8083:80"

volumes:
  wpp_central_mysqldata_nao_apagar:
    labels:
      - "keep=true"
